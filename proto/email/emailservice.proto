syntax = "proto3";

package emailservice;

option go_package = "github.com/TheDurodola/go-email-service/src/config/emailservice";

import "validate/validate.proto";

service EmailService {
    rpc SendEmail (SendEmailRequest) returns (SendEmailResponse) {}
    rpc AddEmailTemplate (EmailTemplateRequest) returns (EmailTemplateResponse) {}
}


enum TemplateType {
  STATIC = 0;   
  DYNAMIC = 1;
}


message SendEmailRequest{
    string firstname = 1 [(validate.rules).string = {
    min_len: 2,
    max_len: 100,
    pattern: "^[a-zA-Z\\s\\-']+$" 
  }];
    string to = 2 [(validate.rules).string.email = true];
    string template_name = 3 ;
    string app_name = 4;
}

message SendEmailResponse {
    bool is_sent = 1;
}

message EmailTemplateRequest {
    string template_name = 1;
    TemplateType template_type = 2;
    string template_body = 3;
}

message EmailTemplateResponse {
    bool is_added = 1;
    string message = 2;
}
